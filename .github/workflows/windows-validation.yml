name: Windows validation and visual preview
on:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Host/**'
      - 'Tests/Web/**'
      - 'Config/**'
      - 'Tests/**/*.ps1'
      - 'Tests/Verify-Package.py'
      - '.github/workflows/**'
      - 'Start CT QA Manager.cmd'
      - 'Apply CT QA Network Update.cmd'
      - 'Export CT QA Diagnostics.cmd'
      - 'Update CT QA Manager.cmd' 
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained offline host
        shell: powershell
        run: |
          dotnet publish Host/CTQa.Host.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o App/Host
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem App/Host -Filter '*.pdb' | Remove-Item
          Get-ChildItem App/Host -File | Where-Object Name -ne 'CTQa.Host.exe' | Remove-Item
          $packageRoot=Join-Path $env:USERPROFILE '.nuget/packages'
          foreach ($runtime in @(@{Package='microsoft.netcore.app.runtime.win-x64';Prefix='DOTNET'},@{Package='microsoft.aspnetcore.app.runtime.win-x64';Prefix='ASPNETCORE'})) {
            $version=Get-ChildItem (Join-Path $packageRoot $runtime.Package) -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
            foreach ($item in @(Get-ChildItem $version.FullName -File | Where-Object Name -match 'LICENSE|THIRD-PARTY-NOTICES')) { Copy-Item $item.FullName (Join-Path 'App/Host' ($runtime.Prefix+'-'+$item.Name)) }
          }
      - name: Synthetic suites on Windows PowerShell 5.1
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path artifacts/windows -Force | Out-Null
          $failed = $false
          foreach ($name in @('Run-ContentTests','Run-AnalysisTests','Run-ContentIntegrationTests','Run-WebServiceTests','Run-ReviewQueueTests','Run-UpdateTests','Run-SupportTests','Run-NetworkTests','Run-Tests','Run-ExportTests','Run-ConnectionTests','Run-BrowseTests','Run-MonthlyTests','Run-PdfTests','Run-PortableTests')) {
            & powershell.exe -NoProfile -File ".\Tests\$name.ps1" -OutputPath ".\artifacts\windows\$name.json"
            if ($LASTEXITCODE -ne 0) { $failed = $true; break }
          }
          if ($failed) { exit 1 }
      - name: Load native WPF and capture synthetic dashboard
        if: always()
        shell: powershell
        run: |
          & powershell.exe -NoProfile -STA -File .\App\Start.ps1 -ValidateLayout
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & powershell.exe -NoProfile -STA -File .\App\Start.ps1 -DemoPreview -ScreenshotPath .\artifacts\windows\dashboard-native-demo.png
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & powershell.exe -NoProfile -STA -File .\App\Start.ps1 -DemoPreview -PreviewPage Advanced -ScreenshotPath .\artifacts\windows\connections-native-demo.png
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & powershell.exe -NoProfile -STA -File .\App\Start.ps1 -DemoPreview -PreviewPage Review -ScreenshotPath .\artifacts\windows\review-native-demo.png
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & powershell.exe -NoProfile -STA -File .\App\Start.ps1 -DemoPreview -PreviewPage Reports -ScreenshotPath .\artifacts\windows\reports-native-demo.png
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & powershell.exe -NoProfile -STA -File .\App\Start.ps1 -DemoPreview -PreviewPage Updates -ScreenshotPath .\artifacts\windows\updates-native-demo.png
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & powershell.exe -NoProfile -STA -File .\App\Start.ps1 -DemoPreview -PreviewPage Queue -ScreenshotPath .\artifacts\windows\queue-native-demo.png
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Browser tests with the real offline host
        if: success()
        shell: powershell
        run: |
          $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD='1'
          npm install --prefix artifacts/web-tools --no-audit --no-fund playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:NODE_PATH=(Join-Path $pwd 'artifacts/web-tools/node_modules')
          node Tests/Web/run-all.cjs --windows --output artifacts/web
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Save tested portable host
        uses: actions/upload-artifact@v4
        with:
          name: portable-web-host
          path: App/Host/
      - name: Save test results and image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation
          path: |
            artifacts/windows/
            artifacts/web/
