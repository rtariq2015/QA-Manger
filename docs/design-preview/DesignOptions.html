<script>

const icon=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.reports}"/></svg>`;
let design='a',page='today',setting='network',focused=true,toastTimer;
const sections=[['today','Today'],['reports','Reports'],['review','Review'],['exports','Exports'],['settings','Settings']];
const names=['CT Edge','CT Flash','MDP Building'];

const offline=()=>'<span class="offline"><span class="dot"></span>Works offline</span>';
function pageHeader(title,description,action='update'){return `<header class="page-top"><div><div class="eyebrow">${page==='today'?'WEDNESDAY, NOVEMBER 11':'YOUR QA WORKSPACE'}</div><h1>${title}</h1><p>${description}</p></div><div class="top-actions">${offline()}${action==='update'?btn('Check new reports','refresh','demo','secondary'):action==='review'?btn(focused?'Show queue':'Focus report','review','focus','secondary'):''}</div></header>`;}

function scannerCard(i){return `<article class="scanner-card panel"><div class="scanner-name"><b>${names[i]}</b>${icon('scanner')}</div><div class="scanner-row"><span class="row-label">${icon('today')} Daily report</span>${status(i===2?'amber':'green',i===2?'Awaiting report':'Received')}</div><div class="scanner-row"><span class="row-label">${icon('reports')} Monthly evidence</span>${status(i===0?'green':i===1?'amber':'neutral',i===0?'Reports collected':i===1?'1 report missing':'Due Nov 25')}</div><p class="small-note">${i===2?'Last checked 9:12 AM':'Saved locally at '+(i?'7:24':'7:08')+' AM'}</p></article>`;}

function todayA(){return `${pageHeader('Today at a glance','Daily reports, monthly evidence and the next useful action.')}${connections()}<div class="hero"><section class="hero-main"><div class="eyebrow">TODAY’S DAILY REPORTS</div><h2>Two received.<br>One still to come.</h2><p>CT Edge and CT Flash are saved. MDP is awaiting today’s PDF.</p>${btn('View daily reports','arrow','reports','small')}<div class="hero-figure">2<small> / 3</small></div></section><section class="month-summary panel"><div class="eyebrow muted">NOVEMBER · MONTHLY EVIDENCE</div><h3>Keep the month on track</h3><div class="month-big"><b>5 <span>/ 6</span></b><span>expected reports collected</span></div><div class="progress"><span style="width:83%"></span></div><p class="muted" style="font-size:10px">One CT Flash report is still needed. Department review is separate.</p><button class="text-link" data-page="reports" style="margin-top:16px">View monthly evidence →</button></section></div><div class="section-head"><div><div class="eyebrow">YOUR SCANNERS</div><h2 style="margin-top:5px">Daily &amp; monthly status</h2></div><a href="#" data-page="reports">Open library →</a></div><div class="scanner-cards">${names.map((_,i)=>scannerCard(i)).join('')}</div>${inboxBanner()}${note()}`;}
function todayB(){return `${pageHeader('Your daily operations','A compact view of receipt, review and the monthly collection.')}${connections()}<div class="stats-strip"><div class="stat-card panel"><span class="accent-line"></span><div class="eyebrow">DAILY REPORTS</div><b>2 <span style="color:var(--muted);font-size:17px">/ 3</span></b><small>One scanner awaiting a PDF</small></div><div class="stat-card panel"><div class="eyebrow">MONTHLY COLLECTION</div><b>5 <span style="color:var(--muted);font-size:17px">/ 6</span></b><small>One report still expected</small></div><div class="stat-card panel"><div class="eyebrow">PENDING FILE REVIEW</div><b style="color:#e3be7c">3</b><small>Type suggestions to confirm</small></div><div class="stat-card panel"><div class="eyebrow">LOCAL LIBRARY</div><b>1,367</b><small>PDFs preserved</small></div></div><div class="work-grid"><section class="panel"><div class="work-title"><h2>Scanner worklist</h2><span class="muted">Updated 9:12 AM</span></div><table><thead><tr><th>Scanner</th><th>Daily · Nov 11</th><th>Monthly · Nov</th><th>Next action</th></tr></thead><tbody>${names.map((n,i)=>`<tr><td class="table-scanner">${n}<small><span class="dot"></span> Connected</small></td><td>${status(i===2?'amber':'green',i===2?'Awaiting':'Received')}<small>${i===2?'Check again when ready':i?'7:24 AM':'7:08 AM'}</small></td><td>${status(i===0?'green':i===1?'amber':'neutral',i===0?'Collected':i===1?'1 missing':'Due Nov 25')}<small>${i===0?'2 of 2 PDFs':i===1?'1 of 2 PDFs':'2 of 2 PDFs'}</small></td><td><button class="text-link" data-page="${i===1?'review':'reports'}">${i===1?'Review files':'Open reports'} →</button></td></tr>`).join('')}</tbody></table><div style="padding:17px 20px;font-size:10px;color:var(--muted)">Report receipt is separate from clinical pass/fail and formal checklist evidence.</div></section><aside class="right-inbox panel"><div class="eyebrow muted">PRIORITY QUEUE</div><h3 style="margin-top:8px">Needs a look</h3><div class="review-item">${status('amber','Confirm report type')}<b>CT Flash · Nov 10</b><p>Suggested Monthly QA</p><small>Open the PDF and choose one action.</small></div><div class="review-item">${status('red','Printed result needs review')}<b>CT Edge · Nov 9</b><p>A printed observation needs attention.</p><small>Inspect the original report.</small></div>${btn('Open review queue','arrow','review','small')} </aside></div><div class="section-head"><h2>Latest library activity</h2><button class="text-link" data-page="reports">All reports →</button></div><div class="panel"><div class="history-row"><div class="icon-box">${icon('reports')}</div><div><strong style="font-size:12px">CT Flash · Daily QA report received</strong><p>Saved locally · 7:24 AM · Automatic filing rule</p></div>${status('green','Received')}</div></div>${note()}`;}
function calendar(){let cells='';for(const l of ['MON','TUE','WED','THU','FRI','SAT','SUN'])cells+=`<span class="day-label">${l}</span>`;for(let n=-5;n<=30;n++){if(n<1){cells+='<span></span>';continue}cells+=`<div class="day ${n<11?'past ':''}${n===11?'today past ':''}${n===25?'due':''}">${n}${n===25?'<span style="display:block;font-size:7px;margin-top:5px">MONTHLY DUE</span>':''}</div>`}return cells;}

const reportRows=[['CT Edge','Nov 11, 2026 · 7:08 AM','Daily QA','Automatic','green'],['CT Flash','Nov 11, 2026 · 7:24 AM','Daily QA','Automatic','green'],['MDP Building','Nov 10, 2026 · 7:21 AM','Daily QA','Approved','green'],['CT Flash','Nov 10, 2026 · 6:54 AM','Suggested Monthly QA','Needs review','amber'],['CT Edge','Nov 9, 2026 · 7:12 AM','Suggested Monthly QA','Needs review','amber'],['MDP Building','Nov 8, 2026 · 8:15 AM','Monthly QA','Approved','green']];
function reports(){return `${pageHeader('Your report library','Find saved PDFs here. Open Review for a large document workspace.')}<div class="filterbar panel"><input id="report-search" class="search" aria-label="Search reports" placeholder="Search scanner, date or report name…"><div class="filter-row"><label>Scanner<select><option>All scanners</option>${names.map(n=>`<option>${n}</option>`).join('')}</select></label><label>Year<select><option>2026</option><option>All years</option><option>2025</option></select></label><label>Month<select><option>November</option><option>All months</option></select></label><label>Report type<select><option>All report types</option><option>Daily QA</option><option>Monthly QA</option></select></label></div></div><div class="report-count"><div><h2>126 reports in this view</h2><p>Browse, filter and inspect. Export packages have their own workspace.</p></div>${btn('Go to exports','exports','exports','secondary')}</div><div class="toolbar-tabs"><button class="selected">All reports</button><button data-action="review">Needs review <b>3</b></button><button data-action="demo">Daily QA</button><button data-action="demo">Monthly QA</button></div><div class="table-wrap panel"><table><thead><tr><th style="width:32%">Scanner &amp; report</th><th>Printed date</th><th>Type</th><th>Filing status</th><th></th></tr></thead><tbody>${reportRows.map((r,i)=>`<tr data-report-row><td><div class="report-name">${r[0]}</div><small>Constancy report · ${i<3?'Basic':'Extended'} layout</small></td><td>${r[1]}</td><td>${r[2]}</td><td>${status(r[4],r[3])}</td><td><button class="text-link" data-page="review">Open in Review →</button></td></tr>`).join('')}</tbody></table></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;font-size:10px;color:var(--muted)"><span>Showing 6 demonstration rows · original PDFs are always kept</span><span>‹ &nbsp; 1 &nbsp; 2 &nbsp; 3 &nbsp; … &nbsp; 21 &nbsp; ›</span></div>${note()}`;}
function paper(n){return `<article class="paper" aria-label="Synthetic PDF page ${n}"><div class="paper-top"><div><span class="paper-eyebrow">SYNTHETIC DEMONSTRATION REPORT</span><h2>Quality IEC Constancy</h2><p style="font-size:10px;color:#79909a;margin-top:5px">CT Edge · Basic constancy checks</p></div><div class="paper-logo">CT QA<br><small style="font-size:8px;letter-spacing:1px">PREVIEW ONLY</small></div></div><div class="paper-meta"><div><label>Report date</label><b>11 November 2026 · 07:08:00</b></div><div><label>Document</label><b>Sample report · no patient data</b></div><div><label>Scanner</label><b>Demonstration CT Edge</b></div><div><label>Test group</label><b>${n===1?'Overview':n===2?'Homogeneity / Water':'Image noise'}</b></div></div>${n===1?`<h3>Report overview</h3><p>This sample document demonstrates the larger, continuous PDF workspace. Scroll down to view all three pages without changing pages manually.</p><table><thead><tr><th>Included test</th><th>Printed observation</th><th>Page</th></tr></thead><tbody><tr><td>Homogeneity / Water</td><td class="raw-ok">OK</td><td>2</td></tr><tr><td>Image noise</td><td class="raw-ok">OK</td><td>3</td></tr></tbody></table><h3>Document details</h3><p>The program keeps the original PDF. The inspector shows supported values and their printed limits separately from file organization and department sign-off.</p><div class="paper-note" style="margin-top:30px">Synthetic sample for visual design review. These measurements do not describe a real scanner or clinical test.</div>`:`<h3>${n===2?'1. Homogeneity / Water':'2. Image noise'}</h3><p>Test: Typical ${n===2?'body':'head'} mode &nbsp; · &nbsp; Results for System A</p><table><thead><tr><th>Slice</th><th>Current value</th><th>Printed lower limit</th><th>Printed upper limit</th></tr></thead><tbody>${[1,2,3,4,5].map((i)=>`<tr><td>Slice ${i}</td><td>${n===2?[-.75,-.6,-.5,-.7,-.65][i-1]:[3.5,3.4,3.6,3.5,3.45][i-1]} HU</td><td>${n===2?'-4.00':'3.00'} HU</td><td>${n===2?'3.40':'4.00'} HU</td></tr>`).join('')}</tbody></table><h3>Measurement summary</h3><div class="chart"><svg viewBox="0 0 600 180" preserveAspectRatio="none"><path d="M0 92 75 94 150 79 225 86 300 73 375 84 450 77 525 82 600 72"/></svg></div><p style="font-size:8px;color:#91a0a5">Demonstration values only · graph included to illustrate report readability.</p><div class="paper-note" style="margin-top:30px">Printed observation: OK. This is documentary text from the synthetic sample; it is separate from a clinical approval.</div>`}<div class="paper-footer"><span>CT QA MANAGER · DESIGN PREVIEW</span><span>November 11, 2026 &nbsp; | &nbsp; Page ${n} / 3</span></div></article>`;}
function review(){return `${pageHeader('Review reports','A full document workspace. Scroll through every page; approve or disapprove the filing suggestion.','review')}<div class="review-workspace"><aside class="queue panel"><div class="queue-heading"><strong>Review queue</strong><span class="muted">3 pending</span></div><div class="queue-list">${names.map((n,i)=>`<div class="queue-item ${i===0?'active':''}" tabindex="0" role="button" data-action="select-queue">${status('amber','Confirm type')}<b>${n}</b><small>Nov ${11-i}, 2026 · ${i?'Extended':'Basic'}<br>Suggested ${i?'Monthly':'Daily'} QA</small></div>`).join('')}<div style="padding:14px 9px;font-size:9px;color:var(--muted)">Disapproved suggestions leave the queue. Their PDFs stay in the library.</div></div></aside><section class="pdf-viewport panel"><div class="pdf-toolbar"><span>${icon('reports')}</span><span class="document-name">CT Edge · November 11 · Constancy report</span><span class="pdf-spacer"></span><span class="page-counter" id="page-counter">3 pages · continuous scroll</span><button data-action="demo" aria-label="Document zoom">Fit width ▾</button></div><div class="pdf-scroll" id="pdf-scroll" tabindex="0" role="region" aria-label="Continuous document pages">${[1,2,3].map(paper).join('')}</div></section><aside class="inspector panel"><div class="inspector-body"><div class="eyebrow muted">REPORT DETAILS</div><h3>Check the suggested type</h3><p>Inspect the PDF, then keep or reject its filing suggestion.</p><div class="evidence-row"><span>Scanner</span><strong>CT Edge</strong></div><div class="evidence-row"><span>Printed date</span><strong>Nov 11, 2026</strong></div><div class="evidence-row"><span>Recognized layout</span><strong>Basic checks</strong></div><div class="evidence-row"><span>Suggested filing</span><strong>Daily QA</strong></div><div class="eyebrow muted" style="margin-top:22px">PRINTED MEASUREMENTS</div><div class="measurement-chip"><div class="muted">Water CT value · Body · Slice 1</div><b>−0.75 <small>HU</small></b><p>Printed limits: −4.00 to 3.40 HU<br>Page 2 · current value</p></div><div class="measurement-chip"><div class="muted">Image noise · Head · Slice 1</div><b>3.50 <small>HU</small></b><p>Printed limits: 3.00 to 4.00 HU<br>Page 3 · current value</p></div><p>These are printed values. Department procedures govern interpretation and clinical sign-off.</p></div><div class="inspector-actions"><div class="decision-buttons"><button class="button" data-action="approve">✓ Approve</button><button class="button danger" data-action="disapprove">× Disapprove</button></div><p>This saves the report type. The original PDF is kept.</p><button class="text-link" data-action="demo">Skip for now →</button></div></aside></div>`;}
function exportsPage(){return `${pageHeader('Export report packages','Choose what to include. Every matching report goes into one organized ZIP.','none')}<div class="export-layout"><section class="export-form panel"><div class="eyebrow muted">1 · CHOOSE YOUR REPORTS</div><h2>Build an export</h2><p>Use a complete month, a year or a specific scanner.</p><div class="field-grid"><label class="form-field">Scanner<select><option>All scanners</option>${names.map(n=>`<option>${n}</option>`).join('')}</select></label><label class="form-field">Year<select><option>2026</option><option>2025</option><option>Multiple years…</option></select></label><label class="form-field">Month<select><option>November</option><option>All months</option></select></label><label class="form-field">Filing status<select><option>All saved reports</option><option>Filed reports only</option><option>Needs review only</option></select></label></div><div class="eyebrow muted" style="margin:27px 0 12px">REPORT TYPES</div>${[['Daily QA','89 reports'],['Monthly QA','12 reports'],['Other / unconfirmed','25 reports']].map(([l,c])=>`<label class="selection-choice"><span><input type="checkbox" checked>${l}</span><small class="muted">${c}</small></label>`).join('')}<div class="settings-notice">Original filenames and decision history remain available in the report inventory. A package does not turn pending files into approved files.</div></section><aside class="export-summary panel"><div class="eyebrow muted">2 · CHECK YOUR PACKAGE</div><div class="big-number">126</div><h3>matching reports</h3><p class="muted" style="font-size:11px;margin-top:7px">All scanners · November 2026</p><ul><li>${icon('folder')}PDFs organized by scanner, year and month</li><li>${icon('reports')}Offline report summary</li><li>${icon('check')}CSV inventory with filing status</li><li>${icon('shield')}Verified copies of the saved PDFs</li></ul>${btn('Export 126 reports (.zip)','exports','export')}<div class="package-tree">Report package /<br>&nbsp; ├─ CT Edge / 2026 / November /<br>&nbsp; ├─ CT Flash / 2026 / November /<br>&nbsp; ├─ MDP Building / 2026 / November /<br>&nbsp; ├─ Report Summary.html<br>&nbsp; └─ Report list.csv</div><p style="font-size:9px;color:var(--muted);margin-top:13px">Preview only. No real export is created here.</p></aside></div><div class="section-head"><h2>Recent export</h2></div><div class="history-row panel"><div class="icon-box">${icon('exports')}</div><div><strong style="font-size:12px">All scanners · October 2026</strong><p>184 PDFs · created Nov 2 · demonstration entry</p></div><button class="text-link" data-action="demo">View details →</button></div>`;}
const settingsList=[['network','network','Scanner connections'],['archive','folder','Archive & folders'],['reading','reports','Reading & filing'],['backup','backup','Backup & support'],['updates','refresh','Program updates']];
function settings(){let content='';if(setting==='network')content=`<div class="eyebrow muted">NETWORK ACCESS</div><h2>Scanner connections</h2><p>Three scanner folders, with their current connection status in one place.</p>${names.map(n=>`<div class="settings-connection"><div class="icon-box">${icon('scanner')}</div><div class="scanner-info"><b>${n}</b><p>Scanner report folder configured · last checked 9:12 AM</p></div>${status('green','Connected')}<button class="button small secondary" data-action="demo">Edit</button></div>`).join('')}<div style="display:flex;gap:10px;margin-top:23px">${btn('Check connections','refresh','demo')}${btn('Apply local profile','network','demo','secondary')}</div><div class="settings-notice">Scanner access uses the internal network. Saved reports remain available offline. Passwords stay out of support logs.</div>`;else if(setting==='archive')content=`<div class="eyebrow muted">LOCAL WORKSPACE</div><h2>Archive &amp; readable folders</h2><p>Keep your saved reports and their readable folder library together.</p><div class="settings-controls"><label class="form-field">Archive location<input value="Program folder / Data" readonly></label><p class="muted" style="font-size:10px;margin-top:9px">Demonstration location. No real workstation paths are shown.</p><div class="package-tree">Report Library / Scanner / Year / Month / Daily, Monthly or Other</div><div style="display:flex;gap:10px;margin-top:22px">${btn('Choose archive folder','folder','demo')}${btn('Open readable library','reports','demo','secondary')}</div></div>`;else if(setting==='reading')content=`<div class="eyebrow muted">AUTOMATION YOU CONTROL</div><h2>Reading &amp; filing</h2><p>Set a scanner’s report-format rules once. Uncertain reports remain in Review.</p><div class="settings-controls"><label class="form-field">Scanner<select>${names.map(n=>`<option>${n}</option>`).join('')}</select></label><div class="field-grid"><label class="form-field">Basic report layout<select><option>Ask me to review</option><option>Daily QA</option><option>Monthly QA</option></select></label><label class="form-field">Extended report layout<select><option>Ask me to review</option><option>Monthly QA</option><option>Daily QA</option></select></label></div><div class="toggle-row"><div><b style="font-size:12px">Read new PDFs in the background</b><p style="font-size:10px;color:var(--muted)">Only while the local program is open.</p></div><span class="toggle"></span></div><label class="form-field">PDF reader<select><option>Automatic · recommended</option><option>Portable Python</option><option>Standard reader</option></select></label><div class="settings-notice">Daily and Monthly are department filing rules. A recognized test layout does not supply the frequency by itself.</div></div>`;else if(setting==='backup')content=`<div class="eyebrow muted">PROTECT YOUR WORK</div><h2>Backup &amp; support</h2><p>Create a full copy on approved separate storage, or export a scrubbed support log.</p><div class="settings-controls">${[['Full backup','Program, archive and saved history.','Create full backup','backup'],['Restore a backup','Restore into a new folder.','Choose backup','folder'],['Support logs','Counts, timings and error codes; report text and credentials are excluded.','Export support logs','shield']].map(([h,p,b,i])=>`<div class="settings-connection"><div class="icon-box">${icon(i)}</div><div class="scanner-info"><b>${h}</b><p>${p}</p></div><button class="button secondary small" data-action="demo">${b}</button></div>`).join('')}</div>`;else content=`<div class="eyebrow muted">OFFLINE PROGRAM UPDATES</div><h2>Update from a ZIP</h2><p>Download an update separately, then choose it here. Your archive and settings stay in place.</p><div style="padding:50px 25px;text-align:center;border:1px dashed #9cbcb4;border-radius:12px;margin:22px 0;background:var(--canvas)"><div style="color:var(--accent);margin-bottom:13px">${icon('refresh')}</div><b>Drop an approved update ZIP here</b><p style="font-size:10px;color:var(--muted);margin:8px 0 17px">or choose the ZIP from this computer</p>${btn('Choose update ZIP','folder','demo')}</div><div class="settings-notice">The program checks the package before installation and keeps a previous-program backup. This is a design preview; no files will be read.</div>`;return `${pageHeader('Workspace settings','Connections, local storage and maintenance, arranged by task.','none')}<div class="settings-layout"><nav class="settings-menu panel" aria-label="Settings categories">${settingsList.map(([v,i,t])=>`<button data-setting="${v}" class="${v===setting?'active':''}">${icon(i)}${t}</button>`).join('')}</nav><section class="settings-content panel">${content}</section></div>`;}
function render(){document.body.dataset.design=design;document.querySelectorAll('.design-choice').forEach(b=>{b.classList.toggle('active',b.dataset.design===design);b.setAttribute('aria-pressed',String(b.dataset.design===design));});const app=document.getElementById('app');app.className='app'+(page==='review'?' review-page':'')+(focused?' focused':'');document.getElementById('brand-mark').innerHTML=icon('pulse');document.querySelector('.nav').innerHTML=sections.map(([id,label])=>`<button data-page="${id}" title="${label}" class="${id===page?'active':''}" aria-label="${label}" ${id===page?'aria-current="page"':''}>${icon(id)}<span>${label}</span>${id==='review'?'<span class="count">3</span>':''}</button>`).join('');document.getElementById('main').innerHTML=page==='today'?(design==='a'?todayA():design==='b'?todayB():todayC()):page==='reports'?reports():page==='review'?review():page==='exports'?exportsPage():settings();document.documentElement.dataset.page=page;document.documentElement.dataset.design=design;document.title=`CT QA · ${design.toUpperCase()} ${['Calm & clear','Operations desk','Calendar studio'][['a','b','c'].indexOf(design)]} · ${page}`;if(page==='reports')document.getElementById('report-search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('[data-report-row]').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(q));});}
function showToast(message){clearTimeout(toastTimer);const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');toastTimer=setTimeout(()=>el.classList.remove('visible'),3800);}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action],button,a');if(!b)return;if(b.dataset.design){design=b.dataset.design;render();return}if(b.dataset.page){event.preventDefault();page=b.dataset.page;render();return}if(b.dataset.setting){setting=b.dataset.setting;render();return}const action=b.dataset.action;if(!action)return;if(sections.some(([id])=>id===action)){page=action;render()}else if(action==='focus'){focused=!focused;render()}else if(action==='approve'||action==='disapprove'){showToast(action==='approve'?'Preview: suggested filing accepted. The next PDF would open.':'Preview: suggestion declined. The PDF would stay in the library.')}else if(action==='export'){showToast('Preview only: this would create the matching report ZIP. No files are written.')}else if(action==='select-queue'){document.querySelectorAll('.queue-item').forEach(i=>i.classList.remove('active'));b.classList.add('active')}else showToast('Design preview only · no files, settings or network connections are changed.');});
window.setPreview=(d,p)=>{if(['a','b','c'].includes(d))design=d;if(sections.some(([id])=>id===p))page=p;render();};
const query=new URLSearchParams(location.search);if(['a','b','c'].includes(query.get('design')))design=query.get('design');if(sections.some(([id])=>id===query.get('page')))page=query.get('page');render();
</script></body></html>
